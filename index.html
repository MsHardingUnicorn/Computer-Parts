<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Build-a-Computer Game!</title>
  <!-- Bright, grade-friendly styling -->
  <style>/* ...styles unchanged for brevity... */
  </style>
</head>
<body>
<div id="app">
  <!-- Screens handled by JS -->
  <!-- 1. Welcome Screen -->
  <div id="welcome-screen" class="screen active"> <!-- ...unchanged... --> </div>

  <!-- 2. Take-Apart Game Screen -->
  <div id="tear-down-screen" class="screen">
    <div class="guide"><span class="guide-emoji">🤖</span>
      <h2>Take Apart the Computer</h2>
    </div>
    <div style="margin-bottom:1em">Drag each computer <b>part</b> out of the diagram.<br>Click a part to learn about it!</div>
    <div class="diagram-area">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Personal_computer,_exploded.svg" alt="Computer Diagram" class="diagram-img" id="tear-down-image">
      <!-- Simplified placeholder. Replace with your own diagram for customization -->
      <div id="parts-draggable" class="parts-area"></div>
    </div>
    <div id="part-explanation" class="explanation-box" style="display:none"></div>
    <button id="tear-down-next">All Done! Next Step →</button>
  </div>
  
  <!-- 3. Labeling Game Screen -->
  <div id="labeling-screen" class="screen"> <!-- ...unchanged... --> </div>

  <!-- 4. Rebuild Game Screen -->
  <div id="rebuild-screen" class="screen"> <!-- ...unchanged... --> </div>
  
  <!-- 5. Score & Printouts Screen -->
  <div id="score-screen" class="screen"> <!-- ...unchanged... --> </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
