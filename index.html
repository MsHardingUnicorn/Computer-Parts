<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build-a-Computer Game</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #eef5fb;
  margin: 0;
}

.screen {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

h1, h2 {
  color: #333;
}

button {
  padding: 10px 20px;
  margin: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  background: #4CAF50;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #45a049;
}

/* Fake "diagram" so no image errors ever */
.diagram-box {
  width: 80%;
  margin: auto;
  padding: 40px;
  background: white;
  border: 3px solid #ccc;
  border-radius: 12px;
  font-size: 60px;
}

/* Parts */
.parts-area {
  margin-top: 20px;
}

.part {
  display: inline-block;
  background: #d9e8f5;
  padding: 12px;
  margin: 8px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.part:hover {
  background: #c4def5;
}

.explanation-box {
  margin-top: 15px;
  padding: 12px;
  background: white;
  border-radius: 10px;
  border: 2px solid #ccc;
}
</style>
</head>

<body>

<!-- Welcome -->
<div id="welcome" class="screen active">
  <h1>🖥️ Build-a-Computer Game</h1>
  <p>Click parts to learn what they do!</p>
  <button onclick="showScreen('game')">Start</button>
</div>

<!-- Game -->
<div id="game" class="screen">
  <h2>Take Apart the Computer</h2>

  <!-- ✅ NEVER BREAKS (no external image) -->
  <div class="diagram-box">🖥️</div>

  <div class="parts-area" id="parts"></div>

  <div id="info" class="explanation-box" style="display:none"></div>

  <button onclick="showScreen('score')">Next</button>
</div>

<!-- Score -->
<div id="score" class="screen">
  <h2>🎉 Great Job!</h2>
  <p>You explored computer parts.</p>

  <div class="diagram-box">🖥️</div>

  <button onclick="showScreen('welcome')">Play Again</button>
</div>

<script>
const parts = [
  {name: "Monitor", info: "Shows images on the screen."},
  {name: "Keyboard", info: "Used to type text."},
  {name: "Mouse", info: "Moves the pointer."},
  {name: "Motherboard", info: "Connects all parts together."},
  {name: "RAM", info: "Short-term memory."},
  {name: "Hard Drive", info: "Stores files."},
  {name: "CPU", info: "The brain of the computer."}
];

const partsContainer = document.getElementById("parts");
const infoBox = document.getElementById("info");

parts.forEach(part => {
  const div = document.createElement("div");
  div.className = "part";
  div.textContent = part.name;

  div.onclick = () => {
    infoBox.style.display = "block";
    infoBox.innerHTML = `<b>${part.name}</b><br>${part.info}`;
  };

  partsContainer.appendChild(div);
});

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
